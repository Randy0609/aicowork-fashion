name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python scripts/verify_public_tree.py
      - run: python -m pytest -q
      - run: python scripts/e2e_model_smoke.py
      - run: python scripts/build_release.py --output /tmp/aicowork-fashion.zip

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: pnpm build

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and probe Docker Compose
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes' EXIT
          docker compose up --build --detach
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8787/api/health | grep '"status":"ok"'
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8787/ | grep 'AiCowork Fashion'
