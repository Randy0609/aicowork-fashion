name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - run: pip install -r apps/api/requirements-dev.txt
      - run: python scripts/verify_public_tree.py
      - run: python -m pytest -q
      - run: python scripts/e2e_model_smoke.py

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - working-directory: apps/web
        run: pnpm build

      - run: python scripts/smoke_boot.py --require-web

      - name: Build and probe Docker Compose
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes' EXIT
          docker compose up --build --detach
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8787/api/health | grep '"status":"ok"'
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8787/ | grep 'AiCowork Fashion'

      - name: Build allowlisted source archive
        run: python scripts/build_release.py --tag "$GITHUB_REF_NAME"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          release/*.zip
          release/*.sha256
          --verify-tag
          --prerelease
          --generate-notes
          --title "AiCowork Fashion $GITHUB_REF_NAME"
